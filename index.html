<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poorchid - The Poor Man's Orchid</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-top">
          <h1>Poorchid</h1>
          <div class="header-actions">
            <button id="flavour-toggle" class="flavour-toggle" title="Master tone/glue chain — toggle on/off">Flavour On</button>
            <button id="record-btn" class="record-btn" title="Record the master output to an audio file">Record</button>
          </div>
        </div>
        <p>The Poor Man's Orchid <span class="version-tag">v0.1.21</span></p>
      </header>
      <main id="synth-interface">
        <!-- Interface will be mounted here -->
        <div class="loading">Loading Synth Engine...</div>
      </main>
      <p class="hint-bar">
        <span><b>Encoders:</b> click to engage · drag/scroll to set · hold for 2nd mode · <kbd>Shift</kbd> = fine</span>
        <span><b>Keys:</b> H–] play · A S D F type · <kbd>\</kbd> Z X C extensions · <kbd>↑</kbd><kbd>↓</kbd> voicing</span>
      </p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
